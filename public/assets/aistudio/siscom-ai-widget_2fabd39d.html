.sai-row{display:flex;gap:6px;align-items:flex-end}
.sai-row textarea{flex:1;resize:none;max-height:90px;border:1px solid var(--sai-bd);border-radius:12px;padding:8px 10px;font:inherit;background:var(--sai-sf);color:var(--sai-tx)}

.sai-snd:disabled,.sai-row textarea:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:480px){#sai{width:100%;border-left:0}#sai-fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#sai,#sai-fab,.sai-dots span{transition:none;animation:none}}
</style>

    { id: 'klien', q: 'Siapa saja klien SISCOM?', kw: 'klien pelanggan customer referensi portofolio', a: 'Daftar klien dan referensi implementasi dapat dilihat di halaman **Klien**.', src: 'Halaman Klien' },

  ];
  var BY_ID = {}; KB.forEach(function (e) { BY_ID[e.id] = e; });
  var WA = 'https://wa.me/6281299817515', DEMO_URL = '/demo';

  /* ---------- 2. Guardrail ---------- */
  var RE_INJECT = /(abaikan|lupakan|ignore|disregard|forget).{0,40}(instruksi|aturan|perintah|instruction|prompt|rules)|system prompt|prompt rahasia|jailbreak|developer mode|\bDAN\b|you are now|berpura-?pura jadi/i;
  var RE_SECRET = /(password|kata sandi|api[ -]?key|secret|token|kredensial|credential|source ?code|kode sumber|database|struktur tabel|akses admin|env\b)/i;
  var RE_OFFTOPIC = /(resep|masak|nasi goreng|cuaca|skor|sepak ?bola|politik|pilpres|saham|kripto|bitcoin|film|lagu|horoskop|zodiak|ramalan|puisi|pantun|tebak|coding|bahasa pemrograman)/i;
  function guard(q) {
    if (RE_INJECT.test(q)) return { why: 'inject', msg: '🛡️ Permintaan ini tidak dapat diproses. Saya tidak dapat mengubah aturan atau membuka instruksi internal asisten.' };

    if (RE_OFFTOPIC.test(q)) return { why: 'off', msg: '🧭 Pertanyaan itu di luar cakupan saya. Saya fokus pada informasi produk dan modul ERP SISCOM.' };
    return null;
  }

  /* ---------- 3. State & util ---------- */
  var S = { ctx: 'home', coins: 5000, dis: 0, run: 0, built: false, transcript: [] }, el = {};
  var esc = function (t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var md = function (t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); };
  var fmt = function (n) { return n.toLocaleString('id-ID'); };

  function resolveCtx() {

    if (p === '/' && location.hash === '#produk') return 'produk';
    return ROUTES[p] || 'home';
  }
  function add(cls, html) {

    el.log.appendChild(d); el.log.scrollTop = el.log.scrollHeight;
    S.transcript.push((/sai-u/.test(cls) ? 'User: ' : 'AI: ') + d.textContent.trim());
    return d;
  }
  function faqBtn(id) { return '<button type="button" class="sai-fq" data-act="faq" data-id="' + id + '">' + esc(BY_ID[id].q) + '<span aria-hidden="true">›</span></button>'; }
  function faqBlock() {
    var c = CTX[S.ctx];

  function answer(e, cost) {

    var w = q.toLowerCase().split(/[^a-z0-9]+/).filter(function (x) { return x.length > 2; }), best = null, bs = 0;
    KB.forEach(function (e) {

    el.coin.textContent = '🪙 ' + fmt(S.coins); el.coin.setAttribute('aria-label', 'Saldo ' + fmt(S.coins) + ' koin AI. Klik untuk isi ulang.');
    var off = S.coins <= 0; el.in.disabled = off; el.send.disabled = off;
    el.ban.innerHTML = off ? '<div class="sai-ban" role="status">Koin AI habis. FAQ tetap gratis. Hubungi admin untuk isi ulang.</div>' : S.coins < 500 ? '<div class="sai-ban" role="status">Sisa koin menipis (' + S.coins + ').</div>' : '';
  }
  function send() {
    var v = el.in.value.trim(); if (!v || S.coins <= 0) return;
    el.in.value = ''; el.cnt.textContent = '0/300 · jawaban AI memakai koin, FAQ gratis'; ask(v);
  }

  /* ---------- 5. Build UI (lazy, saat pertama dibuka → tidak membebani LCP) ---------- */
  function build() {
    ROOT.innerHTML =
      '<header class="sai-hd"><div class="sai-av" aria-hidden="true">AI</div><div class="sai-ti"><b id="sai-title">SISCOM AI</b><small id="sai-ctx"></small></div>' +
      '<button type="button" class="sai-coin" id="sai-coin"></button>' +
      '<button type="button" class="sai-ib" id="sai-mb" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="sai-menu">⋮</button>' +
      '<button type="button" class="sai-ib" data-act="close" aria-label="Tutup asisten">✕</button></header>' +
      '<div id="sai-menu" role="menu" hidden><button role="menuitem" data-act="clear">🗑 Hapus percakapan</button><button role="menuitem" data-act="cs">🎧 Hubungi CS / Buat tiket</button><button role="menuitem" data-act="topup">🪙 Isi ulang koin (demo)</button></div>' +
      '<div id="sai-log" role="log" aria-live="polite" aria-label="Percakapan dengan SISCOM AI" tabindex="0"></div>' +
      '<div class="sai-ft"><div id="sai-ban"></div><small>Jawaban AI mungkin kurang tepat, beri 👍/👎 sebagai koreksi.</small>' +
      '<div class="sai-row"><textarea id="sai-in" rows="1" maxlength="300" aria-label="Pertanyaan Anda" placeholder="Ketik pertanyaan Anda di sini…"></textarea>' +
      '<button type="button" class="sai-snd" id="sai-send" aria-label="Kirim">➤</button></div><small id="sai-cnt" style="text-align:right">0/300 · jawaban AI memakai koin, FAQ gratis</small></div>';
    ['log', 'coin', 'ctx', 'ban', 'in', 'send', 'cnt', 'menu', 'mb'].forEach(function (k) { el[k] = ROOT.querySelector('#sai-' + k); });
    el.send.onclick = send;
    el.in.onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
    el.in.oninput = function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 90) + 'px'; el.cnt.textContent = this.value.length + '/300 · jawaban AI memakai koin, FAQ gratis'; };
    S.built = true; setCtx(resolveCtx(), true); refresh(); welcome();
  }

  /* ---------- 6. Event delegasi ---------- */
  ROOT.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) { if (e.target.closest('#sai-mb')) toggleMenu(); return; }
    var a = b.getAttribute('data-act');
    if (a !== 'clear' && a !== 'cs' && a !== 'topup') toggleMenu(false);
    if (a === 'faq') ask(BY_ID[b.dataset.id].q, b.dataset.id);
    else if (a === 'close') close();
    else if (a === 'clear') { S.run++; toggleMenu(false); welcome(); }
    else if (a === 'cs') { toggleMenu(false); escalate(); }
    else if (a === 'ticket') ticket();
    else if (a === 'topup') { toggleMenu(false); S.coins = 5000; refresh(); add('sai-sys', 'Koin diisi ulang (demo)'); }
    else if (a === 'up' || a === 'down') {
      b.parentNode.querySelectorAll('[aria-pressed]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      if (a === 'up') return add('sai-sys', 'Terima kasih atas masukannya 👍');
      S.dis++;
      add('sai-m sai-b', 'Maaf kurang membantu. Apa yang kurang?<div class="sai-chips"><button type="button" data-act="reason">Kurang jelas</button><button type="button" data-act="reason">Tidak sesuai kebutuhan</button><button type="button" data-act="reason">Informasi salah</button></div>' +
        (S.dis >= 2 ? '<br>Mau langsung dibantu tim CS?<div class="sai-chips"><button type="button" data-act="cs">Hubungi CS</button></div>' : ''));
    }
    else if (a === 'reason') { add('sai-sys', 'Masukan "' + esc(b.textContent) + '" terkirim ke tim Product'); b.parentNode.style.opacity = .6; }
    else if (a === 'copy' && navigator.clipboard) { navigator.clipboard.writeText(b.closest('.sai-m').innerText); b.textContent = 'Tersalin ✓'; }
  });
  el.coinHandler = ROOT.addEventListener('click', function (e) { if (e.target.closest('#sai-coin')) { toggleMenu(false); add('sai-m sai-b', '🪙 Koin dipakai untuk jawaban AI bebas (±15–25 koin). FAQ populer selalu gratis.<div class="sai-chips"><button type="button" data-act="topup">Isi ulang (demo)</button></div>'); } });
  function toggleMenu(force) {
    var open = typeof force === 'boolean' ? force : el.menu.hidden;
    el.menu.hidden = !open; el.mb.setAttribute('aria-expanded', String(open));
    if (open) el.menu.querySelector('button').focus();
  }
  function open() {
    if (!S.built) build();
    ROOT.classList.add('open'); ROOT.removeAttribute('inert'); ROOT.setAttribute('aria-hidden', 'false');
    FAB.hidden = true; FAB.setAttribute('aria-expanded', 'true');
    setTimeout(function () { el.in.focus(); }, 280);
  }
  function close() {
    ROOT.classList.remove('open'); ROOT.setAttribute('inert', ''); ROOT.setAttribute('aria-hidden', 'true');
    FAB.hidden = false; FAB.setAttribute('aria-expanded', 'false'); FAB.focus();
  }
  FAB.addEventListener('click', open);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !ROOT.classList.contains('open')) return;
    if (!el.menu.hidden) { toggleMenu(false); el.mb.focus(); } else close();
  });

  /* ---------- 7. Deteksi rute SPA ---------- */
  function setCtx(k, silent) {
    S.ctx = k; if (!S.built) return;
    el.ctx.textContent = 'Konteks: ' + CTX[k].l;
    if (!silent && ROOT.classList.contains('open')) { add('sai-sys', 'Konteks berubah ke ' + CTX[k].l); faqBlock(); }
  }
  function onNav() { var k = resolveCtx(); if (k !== S.ctx) setCtx(k); }
  ['pushState', 'replaceState'].forEach(function (m) {
    var orig = history[m];
    history[m] = function () { var r = orig.apply(this, arguments); window.dispatchEvent(new Event('sai:nav')); return r; };
  });
  ['popstate', 'hashchange', 'sai:nav'].forEach(function (ev) { window.addEventListener(ev, onNav); });
  S.ctx = resolveCtx();
})();
</script>
